<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke="url(#duha)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Vertikální duhový přechod: červená dole → fialová nahoře, zelená uprostřed -->
    <linearGradient id="duha" x1="0" y1="380" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e53935"/>
      <stop offset="0.2" stop-color="#fb8c00"/>
      <stop offset="0.4" stop-color="#fdd835"/>
      <stop offset="0.5" stop-color="#43a047"/>
      <stop offset="0.7" stop-color="#1e88e5"/>
      <stop offset="0.85" stop-color="#3949ab"/>
      <stop offset="1" stop-color="#8e24aa"/>
    </linearGradient>
  </defs>

  <!-- Vnější kruh -->
  <circle cx="200" cy="200" r="180"/>

  <!-- Květ života: středový kruh + 6 kruhů kolem -->
  <circle cx="200" cy="200" r="90"/>
  <circle cx="290" cy="200" r="90"/>
  <circle cx="110" cy="200" r="90"/>
  <circle cx="245" cy="122.058" r="90"/>
  <circle cx="155" cy="122.058" r="90"/>
  <circle cx="245" cy="277.942" r="90"/>
  <circle cx="155" cy="277.942" r="90"/>

  <!-- Hexagram: trojúhelník vzhůru -->
  <polygon points="200,20 44.118,290 355.882,290"/>

  <!-- Hexagram: trojúhelník dolů -->
  <polygon points="200,380 44.118,110 355.882,110"/>

  <!-- Středový trojúhelník vrcholem nahoru -->
  <!-- Vrcholy leží na středech hran vnějšího trojúhelníku směřujícího dolů -->
  <polygon points="200,110 122.059,245 277.941,245"/>

  <!-- Linie ze středu prochází vrcholy středového trojúhelníku až k vrcholům vnějšího trojúhelníku směřujícího vzhůru -->
  <line x1="200" y1="200" x2="200" y2="20"/>
  <line x1="200" y1="200" x2="44.118" y2="290"/>
  <line x1="200" y1="200" x2="355.882" y2="290"/>
</svg>
