<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 175" aria-label="naraJana">
  <defs>
    <style>
      .logo-text {
        font-family: 'Montserrat', 'Raleway', 'Century Gothic', Arial, sans-serif;
        font-weight: 600;
        fill: #d4620f;
        letter-spacing: 0.06em;
        font-size: 62px;
      }
    </style>
  </defs>

  <!-- Srdíčko nad J — malé plné srdce, stejná barva -->
  <path
    d="M230,14 C230,14 224,7 218,10 C212,13 212,21 218,26 L230,37 L242,26 C248,21 248,13 242,10 C236,7 230,14 230,14 Z"
    fill="#d4620f"
  />

  <!-- J — tenká svislá čára bez příčky + hluboká smyčka dolů vlevo -->
  <path
    d="M230,37 L230,118 Q230,158 210,163 Q190,168 188,150"
    stroke="#d4620f"
    stroke-width="4.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- NARA vlevo od J -->
  <text x="12" y="102" class="logo-text">NARA</text>

  <!-- ANA vpravo od J -->
  <text x="246" y="102" class="logo-text">ANA</text>
</svg>
